<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Criar conta | InterAuto Carros</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Crie sua conta na InterAuto para comprar e vender carros com mais praticidade e segurança.">
        <meta name="robots" content="noindex, follow">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="InterAuto">
        <meta property="og:title" content="Criar conta | InterAuto Carros">
        <meta property="og:description" content="Crie sua conta na InterAuto para comprar e vender carros com mais praticidade e segurança.">
        <meta property="og:locale" content="pt_BR">
        <meta property="og:url" content="https://interauto-jet.vercel.app/pages/cadastro.html">
        <meta property="og:image" content="https://interauto-jet.vercel.app/images/telas/Imagem_capa.jpg">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Criar conta | InterAuto Carros">
        <meta name="twitter:description" content="Crie sua conta na InterAuto para comprar e vender carros com mais praticidade e segurança.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/base.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/footer.css">
        <link rel="stylesheet" href="../css/auth.css">
        <link rel="icon" type="image/png" href="../images/telas/favicon.png">
        <script src="../js/efeitos.js" defer></script>
    </head>
    <body>
        <header>
                 <a href="../" class="logo">
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                </a>
            <nav>
                <div class="menu">
                <a href="./comprar.html">Comprar</a>
                <a href="./vender.html">Vender</a>
                <a href="./sobre.html">Sobre Nós</a>
                </div>
            </nav>
            <a href="./login.html">

                <button>Voltar</button>
            </a>
        </header>
        <br>
        <section class="login-container">
            <div class="login">
                <form id="form-cadastro">
                    <h1>Bem vindo!</h1>
                    <div class="input-container">
                        <input placeholder="Nome" type="text" id="nome" name="nome" autocomplete="name" minlength="2" maxlength="60" required><br><br>
                    </div>
                    <div class="input-container">
                        <input placeholder="Email" type="email" id="email" name="email" autocomplete="email" maxlength="100" required><br><br>
                    </div>
                    <div class="input-container">
                        <input placeholder="Senha" type="password" id="senha" name="senha" autocomplete="new-password" minlength="6" maxlength="100" required><br><br>
                    </div>
                    <div class="input-container">
                        <input placeholder="Confirmar Senha" type="password" id="confirmar-senha" name="confirmar-senha" autocomplete="new-password" minlength="6" maxlength="100" required><br><br>
                    </div>
                        
                    <button type="submit">Criar Conta</button>
                </form>
            </div>
        </section>
        <br><br><br>
            <footer id="rodape">
                <br><br>
                <div>
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                    <img src="../images/telas/logo_facens.jpg" alt="Facens">
                </div>
                <div>
                    <p style="text-align: center;">© 2026 Projeto acadêmico de Web Design – InterAuto</p>
                 </div>
            </footer>
        <script src="../js/auth.js"></script>
    </body>
</html>
