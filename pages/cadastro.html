<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>InterAuto - Cadastro</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/png" href="../images/telas/favicon.png">
        <script src="../js/efeitos.js"></script>
    </head>
    <body>
        <header>
                 <a href="../index.html" class="logo">
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                </a>
            <nav>
                <h1>
                <a href="./comprar.html">Comprar</a>
                <a href="./vender.html">Vender</a>
                <a href="./sobre.html">Sobre Nós</a>
                </h1>
            </nav>
            <a href="./login.html">

                <button>Voltar</button>
            </a>
        </header>
        <br>
        <section class="login-container">
            <div class="login">
                <form id="form-cadastro">
                    <h2>Bem vindo!</h2>
                    <div class="input-container">
                        <input placeholder="Nome" type="text" id="nome" name="nome" autocomplete="name" minlength="2" maxlength="60" required><br><br>
                    </div>
                    <div class="input-container">
                        <input placeholder="Email" type="email" id="email" name="email" autocomplete="email" maxlength="100" required><br><br>
                    </div>
                    <div class="input-container">
                        <input placeholder="Senha" type="password" id="senha" name="senha" autocomplete="new-password" minlength="6" maxlength="100" required><br><br>
                    </div>
                    <div class="input-container">
                        <input placeholder="Confirmar Senha" type="password" id="confirmar-senha" name="confirmar-senha" autocomplete="new-password" minlength="6" maxlength="100" required><br><br>
                    </div>
                        
                    <button type="submit">Criar Conta</button>
                </form>
            </div>
        </section>
        <br><br><br>
            <footer id="rodape">
                <br><br>
                <div>
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                    <img src="../images/telas/logo_facens.jpg" alt="Facens">
                </div>
                <div>
                    <p style="text-align: center;">© 2026 Projeto acadêmico de Web Design – InterAuto</p>
                 </div>
            </footer>
        <script src="../js/auth.js"></script>
    </body>
</html>
