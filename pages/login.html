<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Entrar na sua conta | InterAuto</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Entre na sua conta InterAuto para comprar e vender carros com mais praticidade.">
        <meta name="robots" content="noindex, follow">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="InterAuto">
        <meta property="og:title" content="Entrar na sua conta | InterAuto">
        <meta property="og:description" content="Entre na sua conta InterAuto para comprar e vender carros com mais praticidade.">
        <meta property="og:locale" content="pt_BR">
        <meta property="og:url" content="https://interauto-jet.vercel.app/pages/login.html">
        <meta property="og:image" content="https://interauto-jet.vercel.app/images/telas/Imagem_capa.jpg">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Entrar na sua conta | InterAuto">
        <meta name="twitter:description" content="Entre na sua conta InterAuto para comprar e vender carros com mais praticidade.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/base.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/footer.css">
        <link rel="stylesheet" href="../css/auth.css">
        <link rel="icon" type="image/png" href="../images/telas/favicon.png">
        <script src="../js/efeitos.js" defer></script>
    </head>
    <body>
        <header>
                 <a href="../index.html" class="logo">
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                </a>
            <nav>
                <div class="menu">
                <a href="./comprar.html">Comprar</a>
                <a href="./vender.html">Vender</a>
                <a href="./sobre.html">Sobre Nós</a>
                </div>
            </nav>
            <a href="../index.html">
                <button>Voltar</button>
            </a>
        </header>
        <br>
        <section class="login-container">
            <div class="login">
                <form id="form-login">
                    <h1>Seja bem vindo de volta!</h1>
                    <div class="input-container">
                        <input placeholder="Email" type="email" id="email" name="email" autocomplete="email" maxlength="100" required><br><br>
                    </div>
                    <div class="input-container">
                        <input placeholder="Senha" type="password" id="senha" name="senha" autocomplete="current-password" maxlength="100" required><br><br>
                    </div>
                    <div class="remember-forgot">
                        <label>
                        <input type="checkbox">
                        Lembrar minha senha
                        </label>
                        <a href="#">Esqueci minha senha</a>
                    </div>
                        
                    <button type="submit">Entrar</button>

                    <div class="register-link">
                        <p>Não tem uma conta? <a href="cadastro.html"> Cadastre-se</a></p>
                    </div>
                </form>
            </div>
        </section>
        <br><br><br>
            <footer id="rodape">
                <br><br>
                <div>
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                    <img src="../images/telas/logo_facens.jpg" alt="Facens">
                </div>
                <div>
                    <p style="text-align: center;">© 2026 Projeto acadêmico de Web Design – InterAuto</p>
                 </div>
            </footer>
        <script src="../js/auth.js"></script>
    </body>
</html>
