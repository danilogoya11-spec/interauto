<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>InterAuto - Vender</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/base.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/footer.css">
        <link rel="stylesheet" href="../css/anuncios.css">
        <link rel="stylesheet" href="../css/lojas.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
        <link rel="icon" type="image/png" href="../images/telas/favicon.png">
        <script src="../js/efeitos.js"></script>
    </head>
    <body>
        <header>
                 <a href="../index.html" class="logo">
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                </a>
            <nav>
                <h1>
                <a href="./comprar.html">Comprar</a>
                <a href="./vender.html">Vender</a>
                <a href="./sobre.html">Sobre Nós</a>
                </h1>
            </nav>
            <a href="./login.html">
                 <button>Login</button>
            </a>
        </header>
        <main>
            <section class="corpo">
                <!-- Contato com a loja -->
                <section class="vender">
                    <h1 id="anuncio">VENDER</h1>
                    <h1>Venda seu carro com a InterAuto</h1>
                    <p class="vender-intro">Conte sobre o seu carro e escolha a loja. Um consultor responde pelo WhatsApp com a avaliação.</p>

                    <form id="form-venda" class="vender-form">
                        <div class="campo">
                            <label for="nome">Seu nome</label>
                            <input id="nome" name="nome" type="text" placeholder="Nome completo" maxlength="60" required>
                        </div>
                        <div class="campo">
                            <label for="telefone">WhatsApp</label>
                            <input id="telefone" name="telefone" type="tel" placeholder="(15) 99999-9999" required>
                        </div>
                        <div class="campo">
                            <label for="marca">Marca</label>
                            <input id="marca" name="marca" type="text" placeholder="Fiat" maxlength="30" required>
                        </div>
                        <div class="campo">
                            <label for="modelo">Modelo</label>
                            <input id="modelo" name="modelo" type="text" placeholder="Palio 1.0" maxlength="40" required>
                        </div>
                        <div class="campo">
                            <label for="ano">Ano</label>
                            <input id="ano" name="ano" type="number" min="1950" max="2027" placeholder="2010" required>
                        </div>
                        <div class="campo">
                            <label for="km">Quilometragem (Km)</label>
                            <input id="km" name="km" type="number" min="0" placeholder="89000" required>
                        </div>
                        <div class="campo">
                            <label for="combustivel">Combustível</label>
                            <select id="combustivel" name="combustivel">
                                <option>Flex</option><option>Gasolina</option><option>Etanol</option>
                                <option>Diesel</option><option>Híbrido</option><option>Elétrico</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="cambio">Câmbio</label>
                            <select id="cambio" name="cambio"><option>Manual</option><option>Automático</option></select>
                        </div>
                        <div class="campo">
                            <label for="preco">Preço desejado (R$) – opcional</label>
                            <input id="preco" name="preco" type="number" min="1" placeholder="24900">
                        </div>
                        <div class="campo">
                            <label for="loja">Loja para atendimento</label>
                            <select id="loja" name="loja" required></select>
                        </div>
                        <div class="campo campo-largo">
                            <label for="mensagem-obs">Observações – opcional</label>
                            <textarea id="mensagem-obs" name="mensagem" rows="4" maxlength="400" placeholder="Estado do carro, revisões, documentação… As fotos você envia direto no WhatsApp."></textarea>
                        </div>

                        <div id="retorno" class="mensagem" role="alert"></div>
                        <button type="submit" class="btn-publicar">Entrar em contato com a loja</button>
                    </form>
                </section>

                <!-- Mapa das lojas -->
                <section class="vender vender-mapa">
                    <h2>Lojas mais perto de você</h2>
                    <div class="cabecalho-mapa">
                        <button id="btn-local" type="button" class="btn-sec">Usar minha localização</button>
                    </div>
                    <div id="mapa-lojas" class="mapa" role="region" aria-label="Mapa das lojas InterAuto"></div>
                    <ul id="lista-lojas" class="lista-lojas"></ul>
                </section>
                <br><br><br>
            </section>
        </main>
         <footer id="rodape">
                <div>
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                    <img src="../images/telas/logo_facens.jpg" alt="Facens">
                </div>
                <div>
                    <p style="text-align: center;">© 2026 Projeto acadêmico de Web Design – InterAuto</p>
                 </div>
            </footer>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
        <script src="../js/lojas.js"></script>
        <script src="../js/vender.js"></script>
            <script src="../js/sessao.js"></script>
    </body>
</html>
