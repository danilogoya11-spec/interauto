<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>InterAuto - Comprar</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/lojas.css">
        <!-- Mapa: Leaflet + OpenStreetMap (sem chave de API) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
        <link rel="icon" type="image/png" href="../images/telas/favicon.png">
        <script src="../js/efeitos.js"></script>
    </head>
    <body>
        <header>
                 <a href="../index.html" class="logo">
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                </a>
            <nav>
                <h1>
                <a href="./comprar.html">Comprar</a>
                <a href="./vender.html">Vender</a>
                <a href="./sobre.html">Sobre Nós</a>
                </h1>
            </nav>
            <a href="./login.html">
                 <button>Login</button>
            </a>
        </header>
        <section class="ofertas-carros">
            <br>
            <div class="container">
                <h1 id="ofertas">COMPRAR</h1>
                <h2 class="sub-comprar">Veja os carros disponíveis em cada loja InterAuto.</h2>
                <br>
                <form id="filtros" class="filtros" autocomplete="off" onsubmit="return false">
                    <label>Marca
                        <input id="f-marca" type="text" placeholder="Ex.: Fiat">
                    </label>
                    <label>Modelo
                        <input id="f-modelo" type="text" placeholder="Ex.: Palio">
                    </label>
                    <label>Km máxima
                        <input id="f-km" type="number" min="0" step="1000" placeholder="Ex.: 100000">
                    </label>
                    <label>Preço máximo (R$)
                        <input id="f-preco" type="number" min="0" step="500" placeholder="Ex.: 30000">
                    </label>
                    <label>Cidade da loja
                        <input id="f-cidade" type="text" list="cidades" placeholder="Ex.: Sorocaba">
                        <datalist id="cidades"></datalist>
                    </label>
                    <button type="reset" class="btn-sec">Limpar filtros</button>
                </form>

                <div class="barra-info">
                    <span id="contador" aria-live="polite"></span>
                    <button id="btn-local" type="button">Usar minha localização</button>
                </div>

                <div id="lista-carros" class="grade-carros"></div>
                <p id="vazio" class="vazio" hidden>Nenhum carro encontrado com esses filtros. Tente aumentar o preço ou a km máxima.</p>
            </div>
        </section>

        <!-- Card expandido -->
        <dialog id="modal-carro" aria-label="Detalhes do carro">
            <div class="modal-topo"><button id="modal-fechar" type="button">Fechar</button></div>
            <div id="modal-conteudo"></div>
        </dialog>

         <footer id="rodape">
                <br><br>
                <div>
                    <img src="../images/telas/logo_interauto.png" alt="Interauto">
                    <img src="../images/telas/logo_facens.jpg" alt="Facens">
                </div>
                <div>
                    <p style="text-align: center;">© 2026 Projeto acadêmico de Web Design – InterAuto</p>
                 </div>
            </footer>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
        <script src="../js/lojas.js"></script>
        <script src="../js/comprar.js"></script>
    </body>
</html>
